    <style>
        @font-face {
            font-family: "Impact Label Reversed";
            src: url("fonts/IMPACT_LABEL_REVERSED.TTF") format("truetype");
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-image: url("images/Logo-Background.png");
            background-repeat: repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            color: #000;
            font-family: "Space Mono", monospace;
            padding: 40px 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            max-width: 1100px;
            width: 100%;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-align: center;
        }

        .logo {
            width: 320px;
            max-width: 90%;
            display: block;
        }

        .title {
            font-family: "Impact Label Reversed", sans-serif;
            font-size: 4rem;
            font-weight: 400;
            letter-spacing: 8px;
            color: rgb(149, 67, 8);
            line-height: 1;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgb(149, 67, 8);
            font-family: "Impact Label Reversed", sans-serif;
        }

        .about-section {
            text-align: center;
            max-width: 800px;
            margin: 20px 0;
            line-height: 1.8;
            color: rgb(0, 0, 0);
            font-size: 1rem;
            font-family: "Impact Label Reversed", sans-serif;
        }

        .about-section p {
            margin: 12px 0;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 45px;
            width: 100%;
            align-items: start;
        }

        .video-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .video-title {
            font-family: "Impact Label Reversed", sans-serif;
            font-size: 1.8rem;
            font-weight: 400;
            text-align: center;
            color: rgb(149, 67, 8);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            border: 3px solid rgb(149, 67, 8);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .video-container:hover {
            transform: scale(1.1);
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.3);
        }

        .video-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .video-1::before {
            background-image: url('https://img.youtube.com/vi/caXjtt65Kpo/maxresdefault.jpg');
        }

        .video-2::before {
            background-image: url('https://img.youtube.com/vi/MrG1m2Q90L8/maxresdefault.jpg');
        }

        .video-3::before {
            background-image: url('https://img.youtube.com/vi/hq5bslWGqIg/maxresdefault.jpg');
        }

        .video-4::before {
            background-image: url('https://img.youtube.com/vi/L8pEbMJ3KCo/maxresdefault.jpg');
        }

        .video-5::before {
            background-image: url('https://img.youtube.com/vi/oiB63bqSfNU/maxresdefault.jpg');
        }

        .video-6::before {
            background-image: url('https://img.youtube.com/vi/p9D_ARYulw4/maxresdefault.jpg');
        }

        .video-7::before {
            background-image: url('https://img.youtube.com/vi/2Oqr6qJM35o/maxresdefault.jpg');
        }

        .video-container::after {
            content: '▶';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            color: rgb(248, 227, 193);
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.8);
            z-index: 2;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.5));
        }

        .video-container:hover::after {
            transform: translate(-50%, -50%) scale(1.15);
        }

        .video-container a {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 3;
        }

        .social-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-top: 20px;
            width: 100%;
        }

        .social-title {
            font-family: "Impact Label Reversed", sans-serif;
            font-size: 1.8rem;
            font-weight: 400;
            color: rgb(149, 67, 8);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            color: rgb(149, 67, 8);
            background: transparent;
            border: 3px solid rgb(149, 67, 8);
            border-radius: 0;
            font-size: 1.8rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-links a:hover {
            background: rgb(149, 67, 8);
            color: #fff;
            transform: scale(1.1);
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }

            .videos-grid {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .video-title {
                font-size: 1.4rem;
            }

            .social-title {
                font-size: 1.4rem;
            }

            .social-links {
                gap: 20px;
            }

            body {
                padding: 20px 10px;
            }
        }
    </style>
